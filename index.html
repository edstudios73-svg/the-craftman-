<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The CraftMen Furniture</title>
<meta name="description" content="Beds, sofas, wardrobes, TV stands and cabinets made by hand in Accra. Pay on delivery within Accra. Showroom at Kotobabi Abavana Down.">
<meta property="og:title" content="The CraftMen Furniture — Accra">
<meta property="og:description" content="Made by hand in Accra. Pay on delivery. Call / WhatsApp 054 826 9473.">
<meta property="og:image" content="img/fluffy-cocoa.jpg">
<meta name="theme-color" content="#f4f1e8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f5a46'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='%23fff' text-anchor='middle'%3ECM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181a;
    --muted:#868b84;
    --line:#e6e4da;
    --card:#ffffff;
    --soft:#f2f1ea;
    --green:#2f5a46;
    --green-2:#3f6e57;
    --sage:#dfe7d4;
    --r-lg:28px;
    --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{overflow-x:clip}
  body{
    min-height:100vh;color:var(--ink);
    font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:linear-gradient(165deg,#f6f3ea 0%,#eef0e4 45%,#dde6d2 100%) fixed;
  }
  img{display:block;width:100%;height:100%;object-fit:cover}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{width:22px;height:22px;flex:none}
  .ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .app{width:min(1200px,100%);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px 130px}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .loc small{display:block;font-size:12px;color:var(--muted)}
  .loc a{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px}
  .loc a svg{width:18px;height:18px;color:var(--green)}
  .round{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
  .round svg{width:20px;height:20px}
  .wa-dot{color:#1f9d55}

  /* search */
  .search{display:flex;gap:10px;margin-top:18px}
  .search label{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 16px;height:52px}
  .search label svg{color:var(--muted);width:20px;height:20px}
  .search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink);min-width:0}
  .search input::placeholder{color:#a3a79f}
  .sq{width:52px;height:52px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center}

  /* banner */
  .banner{margin-top:20px}
  .slides{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-lg)}
  .slides::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:start;border-radius:var(--r-lg);display:grid;grid-template-columns:1.05fr 1fr;min-height:178px;overflow:hidden}
  .slide .txt{padding:22px 0 22px 22px;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .slide .kick{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .slide h2{font-size:21px;line-height:1.2;font-weight:700}
  .slide p{font-size:13px;opacity:.8}
  .slide .go{margin-top:10px;align-self:flex-start;font-size:13px;font-weight:600;padding:9px 16px;border-radius:12px}
  .slide .pic{margin:12px 12px 12px 0;border-radius:20px;overflow:hidden}
  .s-green{background:var(--green);color:#fff}
  .s-green .go{background:#fff;color:var(--green)}
  .s-cream{background:#fffdf7}
  .s-cream .go{background:var(--ink);color:#fff}
  .s-sage{background:var(--sage)}
  .s-sage .go{background:var(--green);color:#fff}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
  .dots i{width:6px;height:6px;border-radius:6px;background:#c9ccc2;transition:all .3s}
  .dots i.on{width:18px;background:var(--green)}

  /* section heads */
  .sh{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px;scroll-margin-top:16px}
  .sh h3{font-size:19px;font-weight:700}
  .sh a,.sh .cnt{font-size:13px;color:var(--muted);font-weight:500}

  /* categories */
  .cats{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
  .cats::-webkit-scrollbar{display:none}
  .cat{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:66px;font-size:12.5px;font-weight:500;color:#4c514b}
  .cat span.b{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--green);transition:all .2s}
  .cat span.b svg{width:26px;height:26px}
  .cat.on span.b{background:var(--green);color:#fff}
  .cat.on{color:var(--ink);font-weight:600}

  /* chips */
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;padding:0 20px}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:9px 18px;border-radius:999px;background:var(--card);font-size:13.5px;font-weight:500;color:#4c514b;transition:all .2s}
  .chip.on{background:var(--ink);color:#fff}

  /* product grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .pcard{background:var(--card);border-radius:var(--r);padding:8px;position:relative;display:flex;flex-direction:column}
  .pimg{display:block;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:var(--soft)}
  .pimg img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .pcard:hover .pimg img{transform:scale(1.05)}
  .tag{position:absolute;left:16px;top:16px;background:rgba(22,24,26,.82);color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px}
  .heart{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .heart svg{width:18px;height:18px}
  .heart.on{color:#d0473a}
  .heart.on svg{fill:currentColor}
  .pinfo{padding:10px 6px 4px;display:flex;flex-direction:column;flex:1}
  .pcat{font-size:12px;color:var(--muted)}
  .pinfo h4{font-size:14.5px;font-weight:600;line-height:1.3;margin-top:2px}
  .sw{display:flex;gap:4px;margin-top:6px}
  .sw i{width:9px;height:9px;border-radius:50%}
  .prow{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:6px}
  .price{font-weight:700;font-size:15px}
  .price.ask{font-weight:500;font-size:13px;color:var(--muted)}
  .plus{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
  .plus svg{width:16px;height:16px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 12px;background:rgba(255,255,255,.55);border-radius:var(--r)}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  /* perks */
  .perks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
  .perk{background:rgba(255,255,255,.7);border-radius:var(--r);padding:16px 14px}
  .perk svg{color:var(--green)}
  .perk b{display:block;font-size:13.5px;margin-top:10px}
  .perk span{font-size:12px;color:var(--muted)}

  /* categories page */
  .ptitle{font-size:26px;font-weight:700;margin:22px 0 4px;letter-spacing:-.01em}
  .psub{color:var(--muted);margin-bottom:20px}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .tile{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--soft)}
  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,14,12,.72))}
  .tile div{position:absolute;left:16px;bottom:14px;right:16px;color:#fff;z-index:1;display:flex;justify-content:space-between;align-items:end}
  .tile b{font-size:17px}
  .tile span{font-size:12px;opacity:.85}

  /* visit */
  .vcard{background:var(--card);border-radius:var(--r-lg);overflow:hidden}
  .vcard .vimg{aspect-ratio:16/10}
  .vbody{padding:6px 20px}
  .vrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:0}
  .vrow .ib{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--green);flex:none}
  .vrow small{display:block;color:var(--muted);font-size:12px}
  .vrow b{font-weight:600}
  .vrow .arr{margin-left:auto;color:var(--muted)}
  .steps{display:grid;gap:10px}
  .step{display:flex;gap:14px;background:var(--card);border-radius:var(--r);padding:16px}
  .step i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .step b{display:block}
  .step span{color:var(--muted);font-size:13.5px}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;border-radius:18px;height:58px;font-weight:600;font-size:16px;margin-top:18px;transition:background .2s}
  .bigbtn:hover{background:var(--green-2)}
  .bigbtn svg{width:20px;height:20px}

  /* dock */
  .dock{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--ink);border-radius:40px;padding:7px;display:flex;gap:4px;box-shadow:0 14px 34px -10px rgba(0,0,0,.45)}
  .dock a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#9aa09a;transition:all .25s}
  .dock a:hover{color:#fff}
  .dock a.on{background:#fff;color:var(--ink)}

  /* product detail */
  .detail{position:fixed;inset:0;z-index:40;background:#f7f6f1;overflow-y:auto;overscroll-behavior:contain;animation:up .35s cubic-bezier(.2,.8,.2,1)}
  .detail[hidden]{display:none}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet{min-height:100%;display:flex;flex-direction:column}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 20px 12px;position:sticky;top:0;background:#f7f6f1;z-index:2}
  .dhead span{font-weight:600;font-size:16px}
  .dhead .heart{position:static;box-shadow:none;width:44px;height:44px}
  .dmedia{padding:0 20px}
  .stage{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1/1;background:var(--soft)}
  .thumbs{display:flex;gap:10px;margin:7px -5px 0;overflow-x:auto;scrollbar-width:none;padding:5px}
  .thumbs::-webkit-scrollbar{display:none}
  .thumbs button{width:66px;height:66px;border-radius:14px;overflow:hidden;flex:none;outline:2px solid transparent;outline-offset:2px;opacity:.7;transition:all .2s}
  .thumbs button.on{outline-color:var(--green);opacity:1}
  .dbody{padding:22px 20px 24px;background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;margin-top:18px;flex:1}
  .dtop{display:flex;justify-content:space-between;align-items:center}
  .made{font-size:12px;font-weight:600;color:var(--green);background:#e8efe3;padding:5px 10px;border-radius:999px}
  .dbody h2{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
  .dbody h5{font-size:15px;font-weight:600;margin:20px 0 6px}
  .dbody h5 em{font-style:normal;color:var(--green);font-weight:500}
  .dbody p{color:#6c716a;font-size:14.5px}
  .colors{display:flex;gap:12px;margin-top:4px;padding:4px}
  .colors button{width:32px;height:32px;border-radius:50%;transition:box-shadow .2s}
  .colors button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
  .feats{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .feats span{font-size:12.5px;background:var(--soft);padding:7px 12px;border-radius:999px;color:#4c514b}
  .dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 20px max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:2}
  .dfoot small{display:block;color:var(--muted);font-size:12.5px}
  .dfoot b{font-size:20px;font-weight:700}
  .dfoot b.ask{font-size:16px}
  .buy{display:flex;align-items:center;gap:10px;background:var(--green);color:#fff;border-radius:18px;height:56px;padding:0 22px;font-weight:600;transition:background .2s;white-space:nowrap}
  .buy:hover{background:var(--green-2)}
  .buy svg{width:20px;height:20px}
  .more{padding:4px 20px 28px;background:#fff}
  .more h5{font-size:15px;font-weight:600;margin-bottom:12px}
  .more .pcard{background:var(--soft)}
  .more .pimg{background:#e9e7df}

  @media (min-width:700px){
    .grid{grid-template-columns:repeat(3,1fr);gap:18px}
    .tiles{grid-template-columns:repeat(3,1fr)}
    .slide{flex-basis:calc(50% - 7px);min-height:220px}
    .slide h2{font-size:24px}
    .steps{grid-template-columns:repeat(3,1fr)}
  }
  @media (min-width:1000px){
    .app{padding-left:32px;padding-right:32px}
    .grid{grid-template-columns:repeat(4,1fr)}
    .tiles{grid-template-columns:repeat(4,1fr)}
    .cats{margin:0;padding:0 0 4px;gap:22px}
    .chips{margin-left:0;margin-right:0;padding:0}
    .visit-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
    .visit-wrap .sh{margin-top:0}
    .detail{background:rgba(22,24,26,.45);backdrop-filter:blur(6px);display:grid;place-items:center;padding:32px}
    .detail[hidden]{display:none}
    .sheet{width:min(1040px,100%);min-height:0;height:min(720px,calc(100vh - 64px));border-radius:32px;overflow:hidden;background:#f7f6f1;display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:auto 1fr auto}
    .dhead{grid-column:1/-1;position:static}
    .dmedia{grid-row:2/4;padding:0 0 24px 24px;overflow:auto}
    .dbody{margin:0 24px 0 18px;border-radius:24px 24px 0 0;overflow:auto}
    .dfoot{margin:0 24px 24px 18px;border-radius:0 0 24px 24px;position:static}
    .more{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const WA = 'https://wa.me/233548269473';
const waLink = t => WA + '?text=' + encodeURIComponent(t);

const ICON = {
  Beds:'<path d="M3 18v-5.5A1.5 1.5 0 0 1 4.5 11h15a1.5 1.5 0 0 1 1.5 1.5V18M3 15.5h18M5.5 11V7.5A1.5 1.5 0 0 1 7 6h10a1.5 1.5 0 0 1 1.5 1.5V11M3 18v2M21 18v2"/><path d="M8 11V9.5h3V11M13 11V9.5h3V11"/>',
  Sofas:'<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 12.5a2 2 0 0 1 4 0V15h10v-2.5a2 2 0 0 1 4 0V18H3z"/><path d="M5 18v2M19 18v2"/>',
  Wardrobes:'<rect x="5" y="3" width="14" height="17" rx="1.5"/><path d="M12 3v17M10 10.5v2.5M14 10.5v2.5M7 20v1.5M17 20v1.5"/>',
  'TV Stands':'<rect x="5" y="3.5" width="14" height="8" rx="1"/><path d="M12 11.5v2"/><rect x="2.5" y="13.5" width="19" height="5" rx="1"/><path d="M12 13.5v5M5 18.5l-.5 2M19 18.5l.5 2"/>',
  Cabinets:'<rect x="3.5" y="5" width="17" height="13" rx="1.5"/><path d="M3.5 11.5h17M12 5v13M10 8.3h-.5M14 8.3h.5M10 14.8h-.5M14 14.8h.5M6 18v2M18 18v2"/>',
  Shelves:'<rect x="5" y="2.5" width="14" height="19" rx="1"/><path d="M5 8.8h14M5 15.2h14M9 5.5v3.3M11 6v2.8M14 12v3.2"/>',
  Tables:'<path d="M3 9h18v2.5H3z"/><path d="M5.5 11.5l-1 8.5M18.5 11.5l1 8.5M8 11.5v3h8v-3"/>'
};
const ROOMS = {Beds:'Bedroom',Wardrobes:'Bedroom',Sofas:'Living room','TV Stands':'Living room',Tables:'Living room',Cabinets:'Storage',Shelves:'Storage'};
const CATS = Object.keys(ICON);

const P = [
  {id:'fluffy-bed',name:'Fluffy Luxury Bed Frame',cat:'Beds',priceText:'Depends on size',tag:'Signature',

const priceHtml = p => p.price ? `<span class="price">${p.price}</span>` : `<span class="price ask">${p.priceText ? 'By size' : 'Ask for price'}</span>`;

function card(p) {
  const sw = p.colors ? `<div class="sw">${p.colors.map(c => `<i style="background:${c.hex}"></i>`).join('')}</div>` : '';

}

/* ---------- home ---------- */
const state = { cat: null, room: 'All', q: '' };

function filtered() {
  const q = state.q.trim().toLowerCase();
  return P.filter(p =>
    (!state.cat || p.cat === state.cat) &&
    (state.room === 'All' || ROOMS[p.cat] === state.room) &&
    (!q || (p.name + ' ' + p.cat + ' ' + (p.colors || []).map(c => c.n).join(' ')).toLowerCase().includes(q)));
}

function renderGrid() {
  const list = filtered();
  document.getElementById('grid').innerHTML = list.length ? list.map(card).join('') :
    `<div class="empty"><b>Nothing here yet</b>Send us a picture on WhatsApp and we'll build it for you.</div>`;
  document.querySelectorAll('.cat').forEach(c => c.classList.toggle('on', c.dataset.cat === state.cat));
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', !state.cat && c.dataset.room === state.room));
  document.getElementById('count').textContent = list.length + (list.length === 1 ? ' piece' : ' pieces');
}

  <div class="perks">
    <div class="perk">${svg('<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/>')}<b>Pay on delivery</b><span>Within Accra</span></div>
    <div class="perk">${svg('<path d="m14.5 6.5 3 3M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19z"/>')}<b>Made to order</b><span>Your size &amp; colour</span></div>
    <div class="perk">${svg('<path d="M3 10.5 12 4l9 6.5M5 9v11h14V9M10 20v-5h4v5"/>')}<b>Showroom</b><span>Kotobabi, Accra</span></div>
  </div>`;
}

function mountHome() {
  renderGrid();
  const q = document.getElementById('q');
  q.value = state.q;
  q.addEventListener('input', () => {
    state.q = q.value;
    if (state.q.trim()) { state.cat = null; state.room = 'All'; }
    renderGrid();
  });
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => {
    state.cat = state.cat === b.dataset.cat ? null : b.dataset.cat; state.room = 'All'; renderGrid();
  });
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { state.room = b.dataset.room; state.cat = null; renderGrid(); });

  const slides = document.getElementById('slides'), dots = [...document.querySelectorAll('#dots i')];
  let touched = false;
  const step = () => slides.children[0].offsetWidth + 14;
  slides.addEventListener('scroll', () => {
    const i = Math.min(Math.round(slides.scrollLeft / step()), dots.length - 1);
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });
  ['pointerdown', 'touchstart', 'wheel'].forEach(e => slides.addEventListener(e, () => touched = true, { passive: true }));
  clearInterval(window._auto);
  window._auto = setInterval(() => {
    if (touched || !document.body.contains(slides) || !document.getElementById('detail').hidden) return;
    const max = slides.scrollWidth - slides.clientWidth;
    slides.scrollTo({ left: slides.scrollLeft + 4 >= max ? 0 : slides.scrollLeft + step(), behavior: 'smooth' });
  }, 4500);
}

/* ---------- product detail ---------- */
function openDetail(p) {
  let ci = 0, ii = 0;
  const el = document.getElementById('detail');
  const others = P.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);
  const draw = () => {
    const col = p.colors ? p.colors[ci] : null;
    const msg = "Hello CraftMen, I'm interested in the " + p.name + (col ? ' in ' + col.n : '') +
      (p.price ? ' (' + p.price + '). Is it still available?' : p.priceText ? '. What is the price for my size?' : '. How much is it?');
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${p.name}">
      <div class="dhead"><button class="round" data-close aria-label="Back">${svg('<path d="M15 5l-7 7 7 7"/>')}</button><span>Product Details</span>
        <button class="round heart${saved.has(p.id) ? ' on' : ''}" data-save="${p.id}" aria-label="Save">${svg(HEART)}</button></div>
      <div class="dmedia">
        <div class="stage"><img src="img/${p.imgs[ii]}.jpg" alt="${p.name}${col ? ' in ' + col.n : ''}"></div>
        ${p.imgs.length > 1 ? `<div class="thumbs">${p.imgs.map((im, i) => `<button class="${i === ii ? 'on' : ''}" data-i="${i}" aria-label="Photo ${i + 1}"><img src="img/t/${im}.jpg" alt=""></button>`).join('')}</div>` : ''}
      </div>
      <div class="dbody">
        <div class="dtop"><span class="pcat">${p.cat}</span><span class="made">Made in Accra</span></div>
        <h2>${p.name}</h2>
        <h5>Product Details</h5><p>${p.desc}</p>
        ${p.colors ? `<h5>Select Colour : <em>${col.n}</em></h5><div class="colors">${p.colors.map((c, i) => `<button class="${i === ci ? 'on' : ''}" data-c="${i}" style="background:${c.hex}" aria-label="${c.n}"></button>`).join('')}</div>`
                   : `<h5>Colour <em>· as shown</em></h5><p>Want another colour or fabric? We'll make it for you.</p>`}
        <div class="feats"><span>Pay on delivery · Accra</span><span>Made to order</span><span>Showroom pickup</span></div>
      </div>
      <div class="dfoot"><div>${p.price ? `<small>Total Price</small><b>${p.price}</b>`
          : p.priceText ? '<small>Price depends on</small><b class="ask">your size</b>'
          : '<small>Price</small><b class="ask">On request</b>'}</div>
        <a class="buy" href="${waLink(msg)}" target="_blank" rel="noopener">${WA_ICON}Order on WhatsApp</a></div>
      ${others.length ? `<div class="more"><h5>More ${p.cat.toLowerCase()}</h5><div class="grid">${others.map(card).join('')}</div></div>` : ''}
    </div>`;
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { ii = +b.dataset.i; if (p.colors) ci = ii; draw(); });
    el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ci = +b.dataset.c; ii = ci; draw(); });
    el.querySelector('[data-close]').onclick = closeDetail;
  };
  draw();
  el.hidden = false;
  el.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  if (history.state && history.state.inApp) history.back();
  else location.hash = '#/';
}

/* ---------- router ---------- */
let base = null;
function renderBase(name, cat) {
  const v = document.getElementById('view');
  const changed = base !== name;
  if (name === 'home') {
    if (cat !== undefined) { state.cat = cat; state.room = 'All'; }
    if (changed) { v.innerHTML = home(); mountHome(); } else renderGrid();
  } else {
    v.innerHTML = name === 'categories' ? categories() : name === 'saved' ? savedView() : visit();
  }
  if (changed) window.scrollTo(0, 0);
  if (cat !== undefined) setTimeout(() => document.getElementById('list').scrollIntoView({ behavior: 'smooth' }), 60);
  base = name;
  document.querySelectorAll('.dock a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === name));
}
function route() {
  const h = location.hash.replace(/^#/, '') || '/';
  const det = document.getElementById('detail');
  const m = h.match(/^\/p\/(.+)$/);
  if (m && byId[m[1]]) {
    if (!base) renderBase('home');
    openDetail(byId[m[1]]);
    return;
  }
  det.hidden = true;
  det.innerHTML = '';
  document.body.style.overflow = '';
  const c = h.match(/^\/c\/(.+)$/);
  if (c) renderBase('home', decodeURIComponent(c[1]));
  else if (h === '/categories') renderBase('categories');
  else if (h === '/saved') renderBase('saved');
  else if (h === '/visit') renderBase('visit');
  else renderBase('home');
}

document.addEventListener('click', e => {
  const s = e.target.closest('[data-save]');
  if (s) {
    e.preventDefault();
    const id = s.dataset.save;
    saved.has(id) ? saved.delete(id) : saved.add(id);
    persist();
    document.querySelectorAll(`[data-save="${id}"]`).forEach(b => b.classList.toggle('on', saved.has(id)));
    if (base === 'saved' && document.getElementById('detail').hidden) renderBase('saved');
    return;
  }
  // product links push a history entry so the phone's back button closes the sheet
  const a = e.target.closest('a[href^="#/p/"]');
  if (a) {
    e.preventDefault();
    history.pushState({ inApp: true }, '', a.getAttribute('href'));
    route();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('detail').hidden) closeDetail(); });
document.getElementById('detail').addEventListener('click', e => { if (e.target.id === 'detail') closeDetail(); });
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
route();
</script>
